version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: ginum-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  database:
    image: mysql:8.0
    container_name: ginum-database
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ginum_apps}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./ginum-backend-main
      dockerfile: Dockerfile
    container_name: ginum-backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://database:3306/ginum_apps}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root_password}
      DEMO_SEED_TOKEN: ${DEMO_SEED_TOKEN:-change-me-demo-seed-token}
      SERVER_PORT: 8081
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp-relay.brevo.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-b88e59001@smtp-brevo.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://ginumapps.com}
      APP_EMAIL_FROM: ${APP_EMAIL_FROM:-b88e59001@smtp-brevo.com}

  frontend:
    build:
      context: ./ginum-frontend-main
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: ginum-frontend
    restart: always
    depends_on:
      - backend

volumes:
  db_data:
  caddy_data:
  caddy_config:
